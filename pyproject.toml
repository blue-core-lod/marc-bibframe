[project]
name = "marc-bibframe"
version = "0.3.0"
description = "Convert between MARC and BIBFRAME RDF using the Library of Congress marc2bibframe2 and bibframe2marc XSLTs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "marc",
    "bibframe",
    "marcxml",
    "rdf",
    "marc2bibframe2",
    "bibframe2marc",
    "libraries",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "lxml>=6.0.2",
    "pymarc>=5.2.0",
    "rdflib>=7.1.3",
]

[project.scripts]
marc-bibframe = "marc_bibframe.cli:main"
bibframe-marc = "marc_bibframe.bf2marc_cli:main"

[project.urls]
Homepage = "https://github.com/blue-core-lod/marc-bibframe"
Issues = "https://github.com/blue-core-lod/marc-bibframe/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.6",
    # ty resolves lxml through these; without them lxml.etree is unresolved.
    "lxml-stubs>=0.5.1",
    # Declared so CI resolves the same checker as a local `uv run ty check`,
    # rather than whatever happens to be on PATH.
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marc_bibframe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Converting against the live id.loc.gov is left out of a default run; run it
# with: pytest -m live. The upstream-version nag still runs by default.
addopts = "-v -m 'not live'"
markers = [
    "network: may reach the network, so the offline guard stands aside",
    "live: converts against the live id.loc.gov service, deselected by default",
]
